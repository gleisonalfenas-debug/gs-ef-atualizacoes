name: Atualizar tabelas fiscais (cClassTrib e CEST)
on:
  schedule:
    - cron: "17 9 * * 1"      # toda segunda-feira, 06:17 (Brasília)
  workflow_dispatch:
  push:
    paths: ["tabelas/**", ".github/workflows/tabelas.yml"]
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Baixar e gerar
        run: python tabelas/sondar.py web/tabelas; python tabelas/gerar.py web/tabelas
      - name: Salvar se mudou
        run: |
          git config user.name "nfepro-tabelas"
          git config user.email "nfepro-tabelas@users.noreply.github.com"
          git add web/tabelas
          git diff --cached --quiet || (git commit -m "Tabelas fiscais atualizadas $(date -u +%F)" && git push)
